[project]
name = "bbcli"
version = "0.2.0"
description = "CUHK-SZ Blackboard (bb.cuhk.edu.cn) read-only CLI connector"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
]

[project.scripts]
bb-cli = "bbcli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bbcli"]
