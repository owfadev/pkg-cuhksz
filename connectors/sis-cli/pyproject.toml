[project]
name = "siscli"
version = "0.3.1"
description = "CUHK-SZ SIS (sis.cuhk.edu.cn, PeopleSoft) read-only CLI connector"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
]

[project.scripts]
sis-cli = "siscli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siscli"]
